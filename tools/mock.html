<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>これってバグなの？ — モック</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }

.app { width: 100%; max-width: 560px; }

.app-header { margin-bottom: 1.5rem; }
.app-badge { display: inline-block; font-size: 10px; font-family: monospace; background: #fcebeb; color: #a32d2d; padding: 2px 7px; border-radius: 3px; margin-bottom: 5px; letter-spacing: 0.06em; }
.app-title { font-size: 22px; font-weight: 600; color: #1a1a18; }
.app-sub { font-size: 12px; color: #888780; margin-top: 2px; }

.counter { margin-top: 10px; background: #fff; border: 0.5px solid #e0dfd8; border-radius: 8px; padding: 8px 12px; display: inline-flex; flex-direction: column; gap: 4px; }
.counter-text { font-size: 12px; color: #888780; }
.counter-bar { width: 200px; height: 3px; background: #e0dfd8; border-radius: 2px; overflow: hidden; }
.counter-fill { height: 100%; width: 38%; background: #1a1a18; border-radius: 2px; }

.upload-zone { border: 1px dashed #c8c7c0; border-radius: 12px; padding: 28px 16px; text-align: center; background: #fafaf8; margin: 1.25rem 0 1rem; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.upload-zone:hover { border-color: #888780; background: #fff; }
.upload-zone.has-image { padding: 0; border-style: solid; border-color: #c8c7c0; }
.upload-zone.has-image img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; display: block; background: #fafaf8; }
.upload-img-wrap { position: relative; }
.upload-reset { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0.5px solid #c8c7c0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #888780; font-size: 13px; }
.upload-reset:hover { color: #1a1a18; }
.upload-icon { font-size: 28px; color: #b4b2a9; margin-bottom: 8px; }
.upload-label { font-size: 13px; color: #888780; }
.upload-hint { font-size: 11px; color: #b4b2a9; margin-top: 4px; }

.scan-btn { width: 100%; padding: 12px; background: #1a1a18; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-family: monospace; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.scan-btn:hover:not(:disabled) { opacity: 0.85; }
.scan-btn:active:not(:disabled) { transform: scale(0.98); }
.scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.scanning-area { margin-top: 1.25rem; overflow: hidden; }
.scan-progress { padding: 16px; background: #fafaf8; border-radius: 12px; border: 0.5px solid #e0dfd8; }
.scan-steps { display: flex; flex-direction: column; gap: 10px; }
.scan-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #b4b2a9; transition: color 0.3s; }
.scan-step.active { color: #1a1a18; }
.scan-step.done { color: #3b6d11; }
.step-icon { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #c8c7c0; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; transition: all 0.3s; }
.scan-step.active .step-icon { border-color: #1a1a18; background: #1a1a18; color: #fff; }
.scan-step.done .step-icon { border-color: #639922; background: #eaf3de; color: #3b6d11; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner-ring { width: 14px; height: 14px; border: 2px solid #c8c7c0; border-top-color: #1a1a18; border-radius: 50%; animation: spin 0.7s linear infinite; }

.verdict-area { margin-top: 1.25rem; }

@keyframes verdictPop {
  0%   { opacity: 0; transform: scale(0.92) translateY(8px); }
  60%  { transform: scale(1.03) translateY(-2px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.verdict-pop { animation: verdictPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

.verdict-is-bug { background: #fcebeb; border: 0.5px solid #f7c1c1; border-radius: 12px; padding: 16px 18px; }
.verdict-sad { font-size: 20px; font-weight: 600; color: #a32d2d; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.verdict-ok { background: #eaf3de; border: 0.5px solid #c0dd97; border-radius: 12px; padding: 16px 18px; }
.verdict-good { font-size: 20px; font-weight: 600; color: #3b6d11; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.verdict-unclear { background: #faeeda; border: 0.5px solid #fac775; border-radius: 12px; padding: 16px 18px; }
.verdict-hmm { font-size: 20px; font-weight: 600; color: #854f0b; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.verdict-reason { font-size: 12px; color: #5f5e5a; line-height: 1.6; margin-top: 4px; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ticket-slide { animation: slideDown 0.4s ease forwards; }

.ticket-section-label { font-size: 10px; font-family: monospace; color: #b4b2a9; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 6px; }
.ticket-card { background: #fff; border: 0.5px solid #e0dfd8; border-radius: 12px; overflow: hidden; }
.ticket-head { padding: 10px 14px; border-bottom: 0.5px solid #e0dfd8; display: flex; gap: 8px; align-items: flex-start; }
.ticket-id { font-size: 10px; font-family: monospace; color: #b4b2a9; padding-top: 2px; white-space: nowrap; }
.ticket-title-text { font-size: 13px; font-weight: 600; line-height: 1.4; color: #1a1a18; }
.ticket-meta { padding: 7px 14px; display: flex; gap: 12px; background: #fafaf8; border-bottom: 0.5px solid #e0dfd8; flex-wrap: wrap; }
.meta-item { font-size: 11px; color: #888780; display: flex; align-items: center; gap: 4px; }
.sev-pill { font-size: 10px; padding: 1px 7px; border-radius: 100px; background: #fcebeb; color: #a32d2d; font-weight: 600; }
.ticket-fields { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.field-row { display: flex; gap: 10px; }
.field-key { font-size: 10px; font-family: monospace; color: #b4b2a9; min-width: 72px; padding-top: 2px; flex-shrink: 0; }
.field-val { font-size: 12px; color: #1a1a18; line-height: 1.6; }
.steps-ol { margin: 0; padding-left: 1.1em; font-size: 12px; line-height: 1.7; color: #1a1a18; }

.copy-btn { margin-top: 8px; width: 100%; padding: 8px; background: transparent; border: 0.5px solid #c8c7c0; border-radius: 8px; font-size: 11px; font-family: monospace; color: #888780; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: background 0.12s; }
.copy-btn:hover { background: #fafaf8; color: #1a1a18; }

.limit-banner { background: #faeeda; border: 0.5px solid #fac775; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.limit-title { font-size: 13px; font-weight: 600; color: #854f0b; margin-bottom: 4px; }
.limit-sub { font-size: 12px; color: #5f5e5a; line-height: 1.5; }
.sub-btn { margin-top: 10px; width: 100%; padding: 10px; background: #1a1a18; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.sub-btn:hover { opacity: 0.85; }

.app-footer { margin-top: 2rem; padding-top: 12px; border-top: 0.5px solid #e0dfd8; display: flex; justify-content: space-between; align-items: center; }
.footer-brand { font-size: 12px; font-weight: 600; color: #1a1a18; }
.footer-date { font-size: 11px; color: #b4b2a9; font-family: monospace; }

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-badge">BUG DETECTOR</div>
    <div class="app-title">これってバグなの？</div>
    <div class="app-sub">画像を貼るだけで判定 → バグなら起票内容を自動生成</div>
    <div class="counter">
      <div class="counter-text">今月みんなで 3,847 回使いました（無料枠 10,000 回まで）</div>
      <div class="counter-bar"><div class="counter-fill"></div></div>
    </div>
  </div>

  <div id="upload-zone" class="upload-zone" onclick="mockUpload()">
    <div class="upload-icon"><i class="ti ti-photo-scan"></i></div>
    <div class="upload-label">クリックして画像をアップロード</div>
    <div class="upload-hint">スクリーンショット・エラー画面・UIの不具合など PNG / JPEG / WebP / GIF（5MBまで）</div>
  </div>

  <button class="scan-btn" id="scan-btn" disabled onclick="startScan()">
    <i class="ti ti-search"></i>&nbsp; バグスキャン実行
  </button>

  <div class="scanning-area hidden" id="scanning-area">
    <div class="scan-progress">
      <div class="scan-steps">
        <div class="scan-step" id="step1"><div class="step-icon" id="step1-icon">1</div><span>画像を解析中...</span></div>
        <div class="scan-step" id="step2"><div class="step-icon" id="step2-icon">2</div><span>UIパターンを確認中...</span></div>
        <div class="scan-step" id="step3"><div class="step-icon" id="step3-icon">3</div><span>バグ判定中...</span></div>
      </div>
    </div>
  </div>

  <div class="verdict-area hidden" id="verdict-area"></div>

  <div class="app-footer">
    <div class="footer-brand">🐛 これってバグなの？</div>
    <div class="footer-date">リリース日：2026-06-01</div>
  </div>
</div>

<script>
let uploaded = false;
let scanning = false;

const MOCK_RESULTS = [
  {
    verdict: 'bug',
    reason: 'モバイル幅（375px）でナビゲーションバーのボタンラベルが末尾で切れており、テキストが正しく表示されていません。レスポンシブ対応の不具合と考えられます。',
    ticket: {
      id: 'BUG-4821',
      title: 'モバイル表示でナビゲーションボタンのラベルが切れる',
      severity: 'High',
      category: 'UI',
      description: 'モバイル幅（375px）でボタンのラベルテキストが末尾で「…」と切れて表示される',
      steps: ['スマートフォンで対象画面を開く', 'ナビゲーションバーのボタンを確認する', '画面幅375px以下でテキストが切れることを確認'],
      expected: 'ボタンラベルが全て表示される',
      actual: 'テキストが「設定…」のように途中で切れる',
      env: 'モバイル / iOS Safari（画像から推測）'
    }
  },
  {
    verdict: 'not_bug',
    reason: '表示されている内容はデザイン仕様の範囲内と判断されます。レイアウトの崩れや機能的な問題は見当たりません。意図的なデザインの可能性が高いです。',
  },
  {
    verdict: 'unclear',
    reason: '画像だけでは仕様との差異を判断することが難しい状態です。デザインカンプや仕様書と照らし合わせて確認することをおすすめします。',
  }
];

function mockUpload() {
  if (scanning) return;
  uploaded = true;
  const zone = document.getElementById('upload-zone');
  zone.className = 'upload-zone has-image';
  zone.onclick = null;
  zone.innerHTML = '<div class="upload-img-wrap"><img src="https://via.placeholder.com/560x180/f1efe8/888780?text=screenshot.png" alt="アップロード済み画像" /><button class="upload-reset" onclick="resetAll(event)"><i class="ti ti-x"></i></button></div>';
  document.getElementById('scan-btn').disabled = false;
  document.getElementById('verdict-area').className = 'verdict-area hidden';
  document.getElementById('verdict-area').innerHTML = '';
  document.getElementById('scanning-area').className = 'scanning-area hidden';
  resetSteps();
}

function resetAll(e) {
  if (e) e.stopPropagation();
  uploaded = false; scanning = false;
  const zone = document.getElementById('upload-zone');
  zone.className = 'upload-zone';
  zone.onclick = mockUpload;
  zone.innerHTML = '<div class="upload-icon"><i class="ti ti-photo-scan"></i></div><div class="upload-label">クリックして画像をアップロード</div><div class="upload-hint">スクリーンショット・エラー画面・UIの不具合など PNG / JPEG / WebP / GIF（5MBまで）</div>';
  document.getElementById('scan-btn').disabled = true;
  document.getElementById('scanning-area').className = 'scanning-area hidden';
  document.getElementById('verdict-area').className = 'verdict-area hidden';
  document.getElementById('verdict-area').innerHTML = '';
  resetSteps();
}

function resetSteps() {
  [1,2,3].forEach(i => {
    document.getElementById('step'+i).className = 'scan-step';
    const icon = document.getElementById('step'+i+'-icon');
    icon.className = 'step-icon';
    icon.innerHTML = i;
  });
}

function activateStep(i) {
  document.getElementById('step'+i).className = 'scan-step active';
  const icon = document.getElementById('step'+i+'-icon');
  icon.innerHTML = '<div class="spinner-ring"></div>';
}

function doneStep(i) {
  document.getElementById('step'+i).className = 'scan-step done';
  const icon = document.getElementById('step'+i+'-icon');
  icon.innerHTML = '<i class="ti ti-check" style="font-size:11px"></i>';
}

function startScan() {
  if (!uploaded || scanning) return;
  scanning = true;
  document.getElementById('scan-btn').disabled = true;
  document.getElementById('verdict-area').className = 'verdict-area hidden';
  document.getElementById('verdict-area').innerHTML = '';
  resetSteps();
  document.getElementById('scanning-area').className = 'scanning-area';

  const result = MOCK_RESULTS[Math.floor(Math.random() * MOCK_RESULTS.length)];

  activateStep(1);
  setTimeout(() => { doneStep(1); activateStep(2); }, 900);
  setTimeout(() => { doneStep(2); activateStep(3); }, 1800);
  setTimeout(() => {
    doneStep(3);
    setTimeout(() => {
      document.getElementById('scanning-area').className = 'scanning-area hidden';
      showVerdict(result);
      scanning = false;
      document.getElementById('scan-btn').disabled = false;
    }, 400);
  }, 2700);
}

function showVerdict(result) {
  const area = document.getElementById('verdict-area');
  area.className = 'verdict-area';

  let verdictHTML = '';
  if (result.verdict === 'bug') {
    verdictHTML = `<div class="verdict-is-bug verdict-pop"><div class="verdict-sad"><i class="ti ti-mood-sad" style="font-size:22px"></i> 残念... バグです。</div><div class="verdict-reason">${result.reason}</div></div>`;
  } else if (result.verdict === 'not_bug') {
    verdictHTML = `<div class="verdict-ok verdict-pop"><div class="verdict-good"><i class="ti ti-circle-check" style="font-size:22px"></i> バグではなさそうです</div><div class="verdict-reason">${result.reason}</div></div>`;
  } else {
    verdictHTML = `<div class="verdict-unclear verdict-pop"><div class="verdict-hmm"><i class="ti ti-help-circle" style="font-size:22px"></i> 判断が難しいです</div><div class="verdict-reason">${result.reason}</div></div>`;
  }

  let ticketHTML = '';
  if (result.verdict === 'bug' && result.ticket) {
    const t = result.ticket;
    ticketHTML = `
      <div class="ticket-slide" style="opacity:0">
        <div class="ticket-section-label"><i class="ti ti-ticket" style="font-size:11px"></i>&nbsp;自動生成された起票内容</div>
        <div class="ticket-card">
          <div class="ticket-head">
            <div class="ticket-id">${t.id}</div>
            <div class="ticket-title-text">${t.title}</div>
          </div>
          <div class="ticket-meta">
            <div class="meta-item"><i class="ti ti-alert-triangle" style="font-size:12px"></i>&nbsp;<span class="sev-pill">${t.severity}</span></div>
            <div class="meta-item"><i class="ti ti-tag" style="font-size:12px"></i>&nbsp;${t.category}</div>
            <div class="meta-item"><i class="ti ti-user" style="font-size:12px"></i>&nbsp;未割り当て</div>
          </div>
          <div class="ticket-fields">
            <div class="field-row"><div class="field-key">概要</div><div class="field-val">${t.description}</div></div>
            <div class="field-row"><div class="field-key">再現手順</div><div class="field-val"><ol class="steps-ol">${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div></div>
            <div class="field-row"><div class="field-key">期待する動作</div><div class="field-val">${t.expected}</div></div>
            <div class="field-row"><div class="field-key">実際の動作</div><div class="field-val">${t.actual}</div></div>
            <div class="field-row"><div class="field-key">環境</div><div class="field-val">${t.env}</div></div>
          </div>
        </div>
        <button class="copy-btn" id="copy-btn"><i class="ti ti-copy"></i>&nbsp;起票内容をコピー</button>
      </div>`;
  }

  area.innerHTML = verdictHTML + ticketHTML;

  if (result.verdict === 'bug' && result.ticket) {
    setTimeout(() => {
      const slide = area.querySelector('.ticket-slide');
      if (slide) { slide.style.opacity = '1'; slide.style.animation = 'slideDown 0.4s ease forwards'; }
    }, 200);
    setTimeout(() => {
      const btn = document.getElementById('copy-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const t = result.ticket;
        const text = [
          `【${t.id}】${t.title}`,
          `深刻度: ${t.severity} / カテゴリ: ${t.category}`,
          '', '■ 概要', t.description,
          '', '■ 再現手順', ...t.steps.map((s,i)=>`${i+1}. ${s}`),
          '', '■ 期待する動作', t.expected,
          '', '■ 実際の動作', t.actual,
          '', '■ 環境', t.env
        ].join('\n');
        navigator.clipboard.writeText(text).then(() => {
          btn.innerHTML = '<i class="ti ti-check"></i>&nbsp;コピーしました！';
          setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy"></i>&nbsp;起票内容をコピー'; }, 2000);
        });
      });
    }, 300);
  }
}
</script>
</body>
</html>
