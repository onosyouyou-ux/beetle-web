<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>これってバグなの？ — モック</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/css/mock.css">
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-badge">BUG DETECTOR</div>
    <div class="app-title">これってバグなの？</div>
    <div class="app-sub">画像を貼るだけで判定 → バグなら起票内容を自動生成</div>
    <div class="counter">
      <div class="counter-text">今月みんなで 3,847 回使いました（無料枠 10,000 回まで）</div>
      <div class="counter-bar"><div class="counter-fill"></div></div>
    </div>
  </div>

  <div id="upload-zone" class="upload-zone" onclick="mockUpload()">
    <div class="upload-icon"><i class="ti ti-photo-scan"></i></div>
    <div class="upload-label">クリックして画像をアップロード</div>
    <div class="upload-hint">スクリーンショット・エラー画面・UIの不具合など PNG / JPEG / WebP / GIF（5MBまで）</div>
  </div>

  <button class="scan-btn" id="scan-btn" disabled onclick="startScan()">
    <i class="ti ti-search"></i>&nbsp; バグスキャン実行
  </button>

  <div class="scanning-area hidden" id="scanning-area">
    <div class="scan-progress">
      <div class="scan-steps">
        <div class="scan-step" id="step1"><div class="step-icon" id="step1-icon">1</div><span>画像を解析中...</span></div>
        <div class="scan-step" id="step2"><div class="step-icon" id="step2-icon">2</div><span>UIパターンを確認中...</span></div>
        <div class="scan-step" id="step3"><div class="step-icon" id="step3-icon">3</div><span>バグ判定中...</span></div>
      </div>
    </div>
  </div>

  <div class="verdict-area hidden" id="verdict-area"></div>

  <div class="app-footer">
    <div class="footer-brand">🐛 これってバグなの？</div>
    <div class="footer-date">リリース日：2026-06-01</div>
  </div>
</div>

<script src="/js/mock.js"></script>
</body>
</html>
