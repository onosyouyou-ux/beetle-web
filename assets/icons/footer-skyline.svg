<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" fill="none" role="img" aria-label="街並みのイラスト">
  <g stroke="#d6d7e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line -->
    <line x1="20" y1="208" x2="752" y2="208"/>

    <!-- trees (left) -->
    <g>
      <line x1="70" y1="208" x2="70" y2="150"/>
      <ellipse cx="70" cy="138" rx="16" ry="20"/>
      <line x1="96" y1="208" x2="96" y2="162"/>
      <ellipse cx="96" cy="152" rx="12" ry="15"/>
    </g>

    <!-- arched bridge -->
    <g>
      <path d="M120 208 L120 178 L200 178 L200 208"/>
      <path d="M132 208 a14 14 0 0 1 28 0"/>
      <path d="M162 208 a14 14 0 0 1 28 0"/>
      <line x1="120" y1="178" x2="200" y2="178"/>
    </g>

    <!-- building A (short, windows) -->
    <rect x="214" y="150" width="40" height="58"/>
    <line x1="224" y1="162" x2="244" y2="162"/>
    <line x1="224" y1="176" x2="244" y2="176"/>
    <line x1="224" y1="190" x2="244" y2="190"/>

    <!-- building B (medium grid) -->
    <rect x="262" y="120" width="46" height="88"/>
    <g>
      <rect x="270" y="130" width="9" height="9"/>
      <rect x="286" y="130" width="9" height="9"/>
      <rect x="270" y="148" width="9" height="9"/>
      <rect x="286" y="148" width="9" height="9"/>
      <rect x="270" y="166" width="9" height="9"/>
      <rect x="286" y="166" width="9" height="9"/>
      <rect x="270" y="184" width="9" height="9"/>
      <rect x="286" y="184" width="9" height="9"/>
    </g>

    <!-- building C with antenna + spire -->
    <rect x="320" y="92" width="34" height="116"/>
    <line x1="337" y1="92" x2="337" y2="64"/>
    <line x1="328" y1="108" x2="346" y2="108"/>
    <line x1="328" y1="126" x2="346" y2="126"/>
    <line x1="328" y1="144" x2="346" y2="144"/>
    <line x1="328" y1="162" x2="346" y2="162"/>
    <line x1="328" y1="180" x2="346" y2="180"/>

    <!-- building D (tallest, center) -->
    <rect x="362" y="58" width="50" height="150"/>
    <line x1="387" y1="58" x2="387" y2="208"/>
    <line x1="362" y1="78" x2="412" y2="78"/>
    <line x1="362" y1="100" x2="412" y2="100"/>
    <line x1="362" y1="122" x2="412" y2="122"/>
    <line x1="362" y1="144" x2="412" y2="144"/>
    <line x1="362" y1="166" x2="412" y2="166"/>
    <line x1="362" y1="186" x2="412" y2="186"/>

    <!-- building E (medium) -->
    <rect x="420" y="132" width="40" height="76"/>
    <line x1="428" y1="146" x2="452" y2="146"/>
    <line x1="428" y1="162" x2="452" y2="162"/>
    <line x1="428" y1="178" x2="452" y2="178"/>

    <!-- building F (grid) -->
    <rect x="468" y="104" width="44" height="104"/>
    <g>
      <rect x="476" y="116" width="8" height="8"/>
      <rect x="491" y="116" width="8" height="8"/>
      <rect x="476" y="134" width="8" height="8"/>
      <rect x="491" y="134" width="8" height="8"/>
      <rect x="476" y="152" width="8" height="8"/>
      <rect x="491" y="152" width="8" height="8"/>
      <rect x="476" y="170" width="8" height="8"/>
      <rect x="491" y="170" width="8" height="8"/>
      <rect x="476" y="188" width="8" height="8"/>
      <rect x="491" y="188" width="8" height="8"/>
    </g>

    <!-- building G (short) -->
    <rect x="520" y="156" width="34" height="52"/>
    <line x1="528" y1="170" x2="546" y2="170"/>
    <line x1="528" y1="186" x2="546" y2="186"/>

    <!-- building H (tall, right) -->
    <rect x="562" y="98" width="46" height="110"/>
    <line x1="585" y1="98" x2="585" y2="208"/>
    <line x1="562" y1="116" x2="608" y2="116"/>
    <line x1="562" y1="138" x2="608" y2="138"/>
    <line x1="562" y1="160" x2="608" y2="160"/>
    <line x1="562" y1="182" x2="608" y2="182"/>

    <!-- building I (short, far right) -->
    <rect x="616" y="150" width="36" height="58"/>
    <line x1="624" y1="164" x2="644" y2="164"/>
    <line x1="624" y1="180" x2="644" y2="180"/>

    <!-- trees (right) -->
    <line x1="672" y1="208" x2="672" y2="158"/>
    <ellipse cx="672" cy="146" rx="14" ry="18"/>
    <line x1="700" y1="208" x2="700" y2="168"/>
    <ellipse cx="700" cy="158" rx="11" ry="14"/>
  </g>

  <!-- floating tech icon bubbles -->
  <g stroke="#e7e8f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- code </> bubble -->
    <rect x="250" y="40" width="58" height="42" rx="8"/>
    <path d="M268 70 L274 61 L268 52"/>
    <path d="M290 52 L296 61 L290 70"/>
    <line x1="278" y1="72" x2="286" y2="50"/>
    <!-- QA speech bubble -->
    <path d="M404 28 h60 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-34 l-12 11 v-11 h-14 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8 z"/>
    <!-- gear -->
    <circle cx="556" cy="52" r="15"/>
    <circle cx="556" cy="52" r="6"/>
    <g stroke-width="1.6">
      <line x1="556" y1="31" x2="556" y2="37"/>
      <line x1="556" y1="67" x2="556" y2="73"/>
      <line x1="535" y1="52" x2="541" y2="52"/>
      <line x1="571" y1="52" x2="577" y2="52"/>
      <line x1="541" y1="37" x2="545" y2="41"/>
      <line x1="567" y1="63" x2="571" y2="67"/>
      <line x1="571" y1="37" x2="567" y2="41"/>
      <line x1="545" y1="63" x2="541" y2="67"/>
    </g>
    <!-- checkmark bubble -->
    <rect x="640" y="92" width="44" height="40" rx="8"/>
    <path d="M651 112 l8 8 16 -18"/>
  </g>

  <!-- QA label -->
  <text x="442" y="56" font-family="'Syne',sans-serif" font-size="18" font-weight="700" fill="#e7e8f0" text-anchor="middle">QA</text>

  <!-- dotted connectors + accent dots (orange) -->
  <g stroke="#C0634C" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.85">
    <path d="M279 82 L279 110"/>
    <path d="M308 60 L360 70"/>
    <path d="M442 75 L442 96"/>
    <path d="M472 50 L520 70"/>
    <path d="M556 67 L556 96"/>
    <path d="M608 120 L640 112"/>
  </g>
  <g fill="#C0634C">
    <circle cx="337" cy="62" r="2.6"/>
    <circle cx="387" cy="50" r="2.6"/>
    <circle cx="520" cy="86" r="2.6"/>
    <circle cx="448" cy="118" r="2.2"/>
    <circle cx="298" cy="150" r="2.2"/>
    <circle cx="640" cy="150" r="2.2"/>
  </g>
</svg>
